[package]
name = "messager-ratchet"
version = "0.0.0"
edition = "2021"
publish = false
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
# Exact version: this is the audited cryptography, and upgrading it is a
# deliberate, reviewed change. Default features are off to leave out libolm
# compatibility, which this project has never needed.
vodozemac = { version = "=0.11.2", default-features = false, features = ["wasm_js"] }
# Must match WASM_BINDGEN_VERSION in ../build.sh.
wasm-bindgen = "=0.2.130"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
