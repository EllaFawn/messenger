name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only token: this workflow only checks out code and runs tests.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      # Same image and credentials as docker-compose.yml (local/test only).
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: messager
          POSTGRES_PASSWORD: messager
          POSTGRES_DB: messager
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U messager"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      # Actions are pinned to full commit SHAs so a moved tag cannot change what runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm test
