name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only token: this workflow only checks out code and runs tests.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      # Same image and credentials as docker-compose.yml (local/test only).
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: messager
          POSTGRES_PASSWORD: messager
          POSTGRES_DB: messager
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U messager"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      # Actions are pinned to full commit SHAs so a moved tag cannot change what runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm

      - run: npm ci

      # The ratchet library is committed as a compiled WebAssembly file. Rebuild
      # it from source and fail if it differs, so the binary is never something
      # that has to be taken on trust.
      - name: Check compiled ratchet library matches its source
        run: |
          sh packages/ratchet/build.sh
          git diff --exit-code --stat -- packages/ratchet/wasm
          test -z "$(git status --porcelain -- packages/ratchet/wasm)"

      - run: npm run typecheck

      - run: npm test

      # Catches a web app that type-checks but cannot be bundled.
      - run: npm run build -w @messager/web

      # Tests run against TypeScript source; this checks the compiled server
      # (built by the typecheck step) actually starts under plain Node and
      # serves the web app built in the step above.
      - name: Smoke test compiled server
        env:
          PORT: 3999
          SERVE_WEB: 1
        run: |
          node packages/server/dist/index.js &
          curl --fail --silent --show-error --retry 20 --retry-connrefused --retry-delay 1 http://127.0.0.1:3999/health
          # The built web app is served with its security policy.
          curl --fail --silent --show-error --dump-header headers.txt --output page.html http://127.0.0.1:3999/
          grep -qi "^content-security-policy: default-src 'none'" headers.txt
          grep -q '<div id="root">' page.html
          curl --fail --silent --show-error http://127.0.0.1:3999/api/health

      # The production stack (docker-compose.prod.yml): Caddy -> app -> Postgres,
      # with Caddy issuing a local certificate for "localhost".
      - name: Start production stack
        run: |
          printf 'DOMAIN=localhost\nPOSTGRES_PASSWORD=%s\n' "$(openssl rand -hex 24)" > .env.prod
          docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build --wait --wait-timeout 180

      - name: Check production stack
        run: |
          # HTTPS works end to end and carries both the app's and the proxy's security headers.
          curl --fail --silent --show-error --insecure --retry 10 --retry-all-errors --retry-delay 2 \
            --dump-header prod-headers.txt --output prod-page.html https://localhost/
          grep -qi "^content-security-policy: default-src 'none'" prod-headers.txt
          grep -qi "^strict-transport-security: max-age=31536000" prod-headers.txt
          grep -q '<div id="root">' prod-page.html
          curl --fail --silent --show-error --insecure https://localhost/api/health
          # Plain HTTP is redirected to HTTPS.
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost/)" = "308"
          # The database is not published on the host by the production stack.
          test -z "$(docker port "$(docker compose -f docker-compose.prod.yml --env-file .env.prod ps -q postgres)")"
          # An operator command works inside the container.
          docker compose -f docker-compose.prod.yml --env-file .env.prod exec -T app \
            node packages/server/dist/cli/admin-cli.js invite list

      - name: Production stack logs
        if: failure()
        run: docker compose -f docker-compose.prod.yml --env-file .env.prod logs --no-color --tail 100

